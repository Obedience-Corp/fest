name: coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Test with coverage
        run: just test coverage

      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          file: coverage.out
          format: golang

  windows-x64:
    name: windows-x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cross-build fest.exe (stable)
        run: BUILD_TAGS='' just build windows-x64-gate

  windows-test-compile:
    name: windows-test-compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install just
        uses: extractions/setup-just@v4

      - name: Cross-compile test targets for Windows amd64 (including container_fs activity)
        run: just test windows-test-targets-compile-gate
